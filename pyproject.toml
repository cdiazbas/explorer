[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "explorer"                       # provisional: not for PyPI yet
dynamic = ["version"]
description = "Viewer for solar spectropolarimetric cubes [t, Stokes, lambda, y, x], successor of CRISPEX"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
# measured on 3.12.13; the suites pass on 3.13 (and on 3.14, but Intel Macs' numba 0.62.1 has no 3.14 wheels)
requires-python = ">=3.12,<3.14"
# Pins are the versions the prototype was measured with. Intel Macs get the last numba
# with x86_64 macOS wheels (0.62.1) and the numpy/llvmlite that go with it; its kernels were checked
# identical (hash) against 0.67.0 on arm64 by the prototype's bench/test_numba_compat.py.
dependencies = [
    "numpy==2.5.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy==2.3.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba==0.67.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite==0.49.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "llvmlite==0.45.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "astropy==8.0.1",
    # exact: the X11 bridge calls private symbols of this Qt build; needs macOS >= 13, glibc >= 2.34
    "PySide6==6.11.2",
    "pyqtgraph==0.14.0",
    # the resize outline the X server draws (platform/xoutline.py) uses it on any X display, so it is not an extra
    "python-xlib==0.33",
]

[project.optional-dependencies]
gpu = [                                  # local-only image surfaces; over ssh -Y only pgr shows
    "vispy==0.17.0",
    "pygfx==0.15.3",
    "wgpu==0.29.0",
    "rendercanvas==2.7.2",
]

[project.scripts]
explorer = "explorer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",                       # not pyright: its PyPI package downloads Node.js on first use (bellatrix)
    "import-linter>=2.1",
]

[tool.hatch.version]
source = "vcs"                           # from git tags; before the first tag, the fallback below
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/explorer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/explorer"]

[tool.uv]
# the platforms explorer runs on; the lock resolves for all of them at once
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["bench/results"]                     # measurements and the scripts that made them, not the code

[tool.ruff.lint]
# explicit, so a new ruff version does not change what fails: errors and real traps, not the code's style
select = ["E", "W", "F", "I", "B", "UP", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden_real: comparison on the shared real cubes (only where tests/golden/real/ has references)",
           "real_cubes: one real cube of each kind (tests/real/cubes.toml; only where data/lp/ links resolve)"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["explorer"]
check_untyped_defs = true
warn_unused_ignores = true                # numba's ignores also say unused-ignore: numba 0.67 is typed (py.typed)
                                          # and lacks config/prange, the Intel Mac's 0.62.1 is untyped (Any)
ignore_missing_imports = true           # numba, Xlib and parts of astropy ship no type information

# Layer contracts, checked by `lint-imports` in scripts/check.sh. Contracts for data, core, ui
# and platform are added with those packages. Imports inside functions count too: lazy imports are checked at run
# time by tests/unit/test_cli.py instead.
[tool.importlinter]
root_package = "explorer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "obs uses the standard library only, never the command nor anything heavy"
type = "forbidden"
source_modules = ["explorer.obs"]
forbidden_modules = ["explorer.cli", "explorer.doctor", "explorer.demo", "explorer.testing",
                     "numpy", "numba", "astropy", "PySide6", "pyqtgraph", "Xlib"]

[[tool.importlinter.contracts]]
name = "the update and its check use the standard library only: no Qt, nothing heavy, not the interface"
type = "forbidden"
source_modules = ["explorer.update", "explorer.update_check"]
forbidden_modules = ["explorer.cli", "explorer.ui", "explorer.core", "explorer.data", "explorer.testing",
                     "numpy", "numba", "astropy", "PySide6", "pyqtgraph", "Xlib"]

[[tool.importlinter.contracts]]
name = "data never imports Qt, the command nor the test helpers"
type = "forbidden"
source_modules = ["explorer.data"]
forbidden_modules = ["explorer.cli", "explorer.doctor", "explorer.demo", "explorer.testing",
                     "PySide6", "pyqtgraph", "Xlib"]

[[tool.importlinter.contracts]]
name = "core never imports Qt, the display nor the command"
type = "forbidden"
source_modules = ["explorer.core"]
forbidden_modules = ["explorer.cli", "explorer.doctor", "explorer.demo", "explorer.testing",
                     "PySide6", "pyqtgraph", "Xlib"]

[[tool.importlinter.contracts]]
name = "the display plan is decided before Qt: platform.plan never imports it"
type = "forbidden"
source_modules = ["explorer.platform.plan"]
forbidden_modules = ["PySide6", "pyqtgraph", "Xlib", "explorer.cli"]

[[tool.importlinter.contracts]]
name = "ui draws what the core decides: it never imports the command, doctor nor demo"
type = "forbidden"
source_modules = ["explorer.ui"]
forbidden_modules = ["explorer.cli", "explorer.doctor", "explorer.demo"]

[[tool.importlinter.contracts]]
name = "testing helpers never import the command nor Qt"
type = "forbidden"
source_modules = ["explorer.testing"]
forbidden_modules = ["explorer.cli", "explorer.doctor", "explorer.demo", "PySide6", "pyqtgraph"]

[[tool.importlinter.contracts]]
name = "the platform shows windows: it never imports the core, the interface nor the command"
type = "forbidden"
source_modules = ["explorer.platform"]
forbidden_modules = ["explorer.core", "explorer.ui", "explorer.cli", "explorer.doctor", "explorer.demo",
                     "explorer.testing"]
