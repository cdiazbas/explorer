# Every push: what must never be in the repository (the whole history), and explorer installed and run as a user
# would on each kind of machine it is for (pyproject.toml [tool.uv] environments): Linux x86_64 and macOS arm64.
# The Intel Mac is the third (roadmap X.10).
name: ci

# Paused: by hand only (Actions, "Run workflow"), the account has no CI minutes left. To run it on every push again,
# put back `push:` and `pull_request:` under `on:` (roadmap X.9). Meanwhile scripts/check.sh runs the same checks
# locally, and the git hooks (scripts/install_hooks.sh) keep the hygiene on every commit.
on:
  workflow_dispatch:

jobs:
  hygiene:
    # tracked audit files, personal paths, mentions of AI assistants or co-author trailers anywhere in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/hygiene.py

  any-machine:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the Intel Mac (the third environment of [tool.uv]), GitHub's last x86_64 image, retired
        # in autumn 2027 (GitHub changelog 2025-09-19); after that the Intel Mac is tested nowhere
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      # a failure says enough to be looked into without running it again: why each test failed or was skipped,
      # the locals at each frame, the messages whole (-vv: pytest shortens them otherwise), the slowest
      PYTEST_REPORT: -vv -ra -l --tb=long --durations=15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # the version comes from git
      - uses: astral-sh/setup-uv@v6
      - name: the machine (for whoever reads a failure)
        run: |
          uname -a
          if [ "$(uname -s)" = Darwin ]; then sw_vers; sysctl -n hw.ncpu hw.memsize; else cat /etc/os-release; nproc; free -m; fi
          python3 --version; uv --version
          env | grep -E '^(QT_|DISPLAY|XDG_|WAYLAND)' || true
      - name: system libraries Qt needs, and an X server for the bridge (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 xvfb zsh
      - name: install as a user would
        run: scripts/setup_env.sh --dev
      - name: the explorer command on the PATH, from new terminals of bash and zsh, login or not, another folder
        run: |
          # as a user gets it: no flag, the startup files written by setup_env.sh itself; then terminals that know
          # nothing of this job (a clean environment), each asked where explorer is and to run it
          for sh in bash zsh; do
            exe="$(command -v "$sh")"
            SHELL="$exe" scripts/setup_env.sh --dev --link
            for how in -ic -lic; do
              out="$(cd "$RUNNER_TEMP" && env -i HOME="$HOME" USER="$USER" TERM=dumb PATH=/usr/bin:/bin \
                "$exe" "$how" 'command -v explorer && explorer --version' </dev/null 2>/dev/null)" || true
              echo "== $sh $how: $out"
              case "$out" in "$HOME"/*/explorer*"explorer "[0-9]*) ;; *) echo "::error::$sh $how"; exit 1 ;; esac
            done
          done
          for f in ~/.bashrc ~/.bash_profile ~/.bash_login ~/.profile ~/.zshrc; do
            if [ -f "$f" ]; then echo "== $f"; sed -n '/>>> explorer/,/<<< explorer/p' "$f"; fi
          done
      - name: doctor, and the demo without a window
        run: |
          cd "$RUNNER_TEMP"
          env -u DISPLAY QT_QPA_PLATFORM=offscreen "$GITHUB_WORKSPACE/scripts/run.sh" doctor
          env -u DISPLAY QT_QPA_PLATFORM=offscreen "$GITHUB_WORKSPACE/scripts/run.sh" demo --no-window --moves 20
      - name: lint and layer contracts
        run: |
          bin=$(echo .venv-*/bin)
          "$bin/ruff" check src tests scripts bench tools
          "$bin/lint-imports"
      - name: types
        run: $(echo .venv-*/bin)/mypy
      - name: unit and golden tests
        run: |
          env -u DISPLAY QT_QPA_PLATFORM=offscreen $(echo .venv-*/bin)/python -m pytest -q tests/unit tests/golden \
            $PYTEST_REPORT --junitxml="$RUNNER_TEMP/reports/unit.xml"
      - name: the X11 bridge against a real X server (Linux)
        if: runner.os == 'Linux'
        run: |
          # its keymap warnings (xkbcomp) go to a file, shown below on a failure
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 2
          EXPLORER_TEST_XDISPLAY=:99 $(echo .venv-*/bin)/python -m pytest -q tests/xvfb \
            $PYTEST_REPORT --junitxml="$RUNNER_TEMP/reports/xvfb.xml"
      - name: on failure, what was installed and what explorer logged
        if: failure()
        run: |
          uv pip list --python "$(echo .venv-*/bin)/python" || true
          for f in "${XDG_CACHE_HOME:-$HOME/.cache}"/explorer/logs/*; do [ -f "$f" ] && { echo "== $f"; tail -n 200 "$f"; }; done
          [ -f "$RUNNER_TEMP/xvfb.log" ] && { echo "== Xvfb"; grep -v "Could not resolve keysym" "$RUNNER_TEMP/xvfb.log"; } || true
      - name: on failure, keep the logs and the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.os }}
          path: |
            ~/.cache/explorer/logs/
            ${{ runner.temp }}/reports/
          if-no-files-found: ignore
