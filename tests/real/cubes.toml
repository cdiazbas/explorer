# One real cube of each kind found in the shared reduced data (CRISP LP and FITS cubes), linked into the
# project's data/lp/ under generic names (ln -s, never copied; which file each link is stays out of the repository,
# in docs/data.local.md): only where those links resolve (bellatrix). tests/real/test_real_cubes.py opens each one,
# reads it, checks it against what it must equal, and starts the viewer on it without a screen.
#
# The link names keep the patterns explorer reads from a name: <stem>_im / <stem>_sp, .aligned6173, clipped=,
# Blos_ and Blos. for the field maps.
# opens = true: shape is the cube's (t, s, lambda, y, x); fits = the same observation as FITS, which the frames
# must equal up to the integer scaling; fits_s = which Stokes of the FITS a single-Stokes cube is.
# opens = false: the kind explorer cannot open yet; todo = the roadmap task, run as an expected failure (strict),
# so the day it opens the test says so.

